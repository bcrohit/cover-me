<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoverMe</title>
    <link rel="stylesheet" href="../styles/design-system.css" />
</head>
<body>
    <div id="app">
        <header class="app-header">
            <div class="app-brand">
                <div class="app-brand__logo" aria-hidden="true">C</div>
                <div>
                    <h1 class="text-display">CoverMe</h1>
                    <p class="text-caption">AI Career Copilot</p>
                </div>
                <div class="app-brand__badge">
                    <span id="app-badge" class="status-badge status-badge--primary">Beta</span>
                </div>
            </div>
            <div id="app-stepper-host"></div>
        </header>

        <main id="app-main" class="app-main" role="main"></main>

        <p id="app-status" class="app-status text-caption section-hidden" role="status" aria-live="polite"></p>

        <footer id="app-footer" class="app-footer"></footer>
    </div>
    <script type="module" src="popup.js"></script>
</body>
</html>
